- boot: install setup image_copy unattended_install.cdrom
    only Windows
    virt_test_type = qemu libvirt
    type = boot
    serial_login = no
    restart_vm = yes
    kill_vm_on_error = yes
    login_timeout = 90
    auto_cpu_model = no
    cpu_model = SapphireRapids
    cpu_model_flags = 'vmx=on,hle=off,rtm=off,taa-no=off,hv_stimer,hv_synic,hv_vpindex,hv_relaxed,hv_spinlocks=0x1fff,hv_vapic,hv_time,hv_frequencies,hv_runtime,hv_tlbflush,hv_reenlightenment,hv_stimer_direct,hv_ipi,hv-xmm-input,hv_tlbflush_ext,kvm_pv_unhalt=on'
    variants:
        - @default:
            vcpu_maxcpus = 1
            vcpu_cores = 1
            vcpu_dies = 1
            vcpu_sockets = 1
            vcpu_threads = 1
        - 2vcpu:
            vcpu_maxcpus = 2
            vcpu_cores = 2
            vcpu_dies = 1
            vcpu_sockets = 1
            vcpu_threads = 1
    variants:
        - @default:
        - dtes64:
            cpu_model_flags += ',dtes64=on'
    variants:
        - @default:
        - pdcm:
            cpu_model_flags += ',pdcm=on'
    variants:
        - @default:
        - hypervisor:
            cpu_model_flags += ',hypervisor=on'
    variants:
        - @default:
        - ds:
            cpu_model_flags += ',ds=on'
    variants:
        - @default:
        - ss:
            cpu_model_flags += ',ss=on'
    variants:
        - @default:
        - tsc:
            cpu_model_flags += ',tsc-adjust=on'
    variants:
        - @default:
        - waitpkg:
            cpu_model_flags += ',waitpkg=on'
    variants:
        - @default:
        - cldemote:
            cpu_model_flags += ',cldemote=on'
    variants:
        - @default:
        - movdiri:
            cpu_model_flags += ',movdiri=on'
    variants:
        - @default:
        - movdir64b:
            cpu_model_flags += ',movdir64b=on'
    variants:
        - @default:
        - md-clear:
            cpu_model_flags += ',md-clear=on'
    variants:
        - @default:
        - stibp:
            cpu_model_flags += ',stibp=on'
    variants:
        - @default:
        - flush-l1d:
            cpu_model_flags += ',flush-l1d=on'
    variants:
